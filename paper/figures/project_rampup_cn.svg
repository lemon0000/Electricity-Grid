<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="103.665mm" viewBox="0 0 519 294" role="img" aria-labelledby="title desc">
<title id="title">进度错位与分阶段接入</title>
<desc id="desc">Conceptual example on one shared time axis; icon counts do not encode measured quantities.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#23364A"/></marker></defs>
<rect x="0" y="0" width="519" height="294" fill="white"/>
<text x="18" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#23364A">三条进度路径，共同决定每个阶段的履约条件</text>
<text x="18" y="38.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">同一个AI智算中心 · 共同时间轴 · 阶段由实际状态变化界定</text>
