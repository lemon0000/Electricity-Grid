<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker>
    <style>
      .title{font:700 30px Arial,'Microsoft YaHei',sans-serif;fill:#222222}
      .lane{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#222222}
      .head{font:700 21px Arial,'Microsoft YaHei',sans-serif;fill:#222222}
      .body{font:400 19px Arial,'Microsoft YaHei',sans-serif;fill:#333333}
      .card{stroke-width:2}
      .arrow{fill:none;stroke:#666666;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#FFFFFF"/>
  <text x="800" y="40" text-anchor="middle" class="title">项目总体研究流程</text>
  <text x="235" y="82" text-anchor="middle" class="lane">数据与场景</text>
  <text x="800" y="82" text-anchor="middle" class="lane">协同规划模型</text>
  <text x="1365" y="82" text-anchor="middle" class="lane">评估与输出</text>

  <g class="card">
    <rect x="60" y="110" width="350" height="125" rx="14" fill="#EAF2FA" stroke="#2166AC"/>
    <text x="235" y="150" text-anchor="middle" class="head">公开数据</text><text x="235" y="185" text-anchor="middle" class="body">电网、无碳电力、业务功率</text>
    <rect x="60" y="300" width="350" height="125" rx="14" fill="#FFF3E1" stroke="#F1A340"/>
    <text x="235" y="340" text-anchor="middle" class="head">不确定性场景</text><text x="235" y="375" text-anchor="middle" class="body">达产阶段与扩建延期</text>
    <rect x="60" y="490" width="350" height="125" rx="14" fill="#F1EAF5" stroke="#762A83"/>
    <text x="235" y="530" text-anchor="middle" class="head">训练与留出划分</text><text x="235" y="565" text-anchor="middle" class="body">随机种子与信息边界</text>
  </g>
  <g class="card">
    <rect x="625" y="110" width="350" height="125" rx="14" fill="#FFF3E1" stroke="#F1A340"/>
    <text x="800" y="150" text-anchor="middle" class="head">多阶段协同规划</text><text x="800" y="185" text-anchor="middle" class="body">接入容量、扩建时序、N-1</text>
    <rect x="625" y="300" width="350" height="125" rx="14" fill="#F1EAF5" stroke="#762A83"/>
    <text x="800" y="340" text-anchor="middle" class="head">共享业务柔性包络</text><text x="800" y="375" text-anchor="middle" class="body">功率、持续时间、事件次数</text>
    <rect x="625" y="490" width="350" height="125" rx="14" fill="#EAF2FA" stroke="#2166AC"/>
    <text x="800" y="530" text-anchor="middle" class="head">年度与小时级约束</text><text x="800" y="565" text-anchor="middle" class="body">网络服务与无碳电力服务</text>
  </g>
  <g class="card">
    <rect x="1190" y="110" width="350" height="125" rx="14" fill="#E8F3EC" stroke="#1B7837"/>
    <text x="1365" y="150" text-anchor="middle" class="head">策略冻结</text><text x="1365" y="185" text-anchor="middle" class="body">在训练场景确定柔性配置</text>
    <rect x="1190" y="300" width="350" height="125" rx="14" fill="#E8F3EC" stroke="#1B7837"/>
    <text x="1365" y="340" text-anchor="middle" class="head">场景外时序回放</text><text x="1365" y="375" text-anchor="middle" class="body">不使用未来信息重新优化</text>
    <rect x="1190" y="490" width="350" height="125" rx="14" fill="#F8E9EB" stroke="#B2182B"/>
    <text x="1365" y="530" text-anchor="middle" class="head">结果与风险识别</text><text x="1365" y="565" text-anchor="middle" class="body">容量、短缺、恢复债务、识别界</text>
  </g>
  <path d="M410 172 H625" class="arrow"/><path d="M410 362 H625" class="arrow"/><path d="M410 552 H625" class="arrow"/>
  <path d="M975 172 H1190" class="arrow"/><path d="M975 362 H1190" class="arrow"/><path d="M975 552 H1190" class="arrow"/>
  <path d="M235 235 V300" class="arrow"/><path d="M235 425 V490" class="arrow"/>
  <path d="M800 235 V300" class="arrow"/><path d="M800 425 V490" class="arrow"/>
  <path d="M1365 235 V300" class="arrow"/><path d="M1365 425 V490" class="arrow"/>
</svg>
