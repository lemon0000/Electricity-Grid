<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="93.087mm" viewBox="0 0 519 264" role="img" aria-labelledby="title desc">
<title id="title">研究比较与独立留出检验</title>
<desc id="desc">Given plans are compared using three assessments under common inputs, then frozen with a policy before causal holdout execution.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#23364A"/></marker></defs>
<rect x="0" y="0" width="519" height="264" fill="white"/>
<text x="18" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#23364A">用匹配比较解释差异，再检验新路径上的适用性</text>
<text x="18" y="38.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">研究设计与预期输出 · 方案判断由实际计算证据确定</text>
<g id="n:step-1">
<circle cx="28" cy="68" r="10" fill="#EDF3F8" stroke="#496F91" stroke-width="1"/>
<text x="28" y="71.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">1</text>
<text x="18" y="95.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#23364A">固定比较条件</text>
<rect x="18" y="106" width="114" height="89" rx="4" fill="#F2F5F7" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="27" y="125.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">给定建设与接入计划</text>
<text x="27" y="149.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">相同外生业务与CFE</text>
<text x="27" y="173.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">一致的期限与服务规则</text>
<path d="M132 151 L140 151" fill="none" stroke="#23364A" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="n:step-2">
<circle cx="151" cy="68" r="10" fill="#EDF3F8" stroke="#496F91" stroke-width="1"/>
<text x="151" y="71.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">2</text>
<text x="141" y="95.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#23364A">比较三种评价</text>
<rect x="141" y="106" width="114" height="89" rx="4" fill="#EAF4F1" stroke="#CAD4DC" stroke-width="0.8"/>
<path d="M150 123 L158 123" fill="none" stroke="#496F91" stroke-width="2"/>
<text x="163" y="126.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">瞬时MW</text>
<path d="M150 148 L158 148" fill="none" stroke="#496F91" stroke-width="2"/>
<text x="163" y="151.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">固定恢复余量</text>
<path d="M150 173 L158 173" fill="none" stroke="#287F80" stroke-width="2"/>
<text x="163" y="176.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">完整时序评价</text>
<path d="M255 151 L263 151" fill="none" stroke="#23364A" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="n:step-3">
<circle cx="274" cy="68" r="10" fill="#EDF3F8" stroke="#496F91" stroke-width="1"/>
<text x="274" y="71.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">3</text>
<text x="264" y="95.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#23364A">解释阶段性瓶颈</text>
<rect x="264" y="106" width="114" height="89" rx="4" fill="#F2F5F7" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="273" y="125.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">何时改变方案判断？</text>
<text x="273" y="149.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">当前响应还是期限内恢复？</text>
<text x="273" y="173.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">保留无差异与失败区域</text>
<path d="M378 151 L386 151" fill="none" stroke="#23364A" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="n:step-4">
<circle cx="397" cy="68" r="10" fill="#EDF3F8" stroke="#496F91" stroke-width="1"/>
<text x="397" y="71.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">4</text>
<text x="387" y="95.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#23364A">冻结后独立检验</text>
<rect x="387" y="106" width="114" height="89" rx="4" fill="#F2F5F7" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="396" y="125.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">冻结计划与运行策略</text>
<text x="396" y="149.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">独立留出路径</text>
<text x="396" y="173.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">按当时信息因果执行</text>
</g>
<path d="M381 87 L381 202" fill="none" stroke="#496F91" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="442" y="213.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">留出不参与方案选择</text>
<rect x="18" y="229" width="483" height="24" rx="4" fill="#EDF3F8" stroke="#EDF3F8" stroke-width="0.8"/>
<text x="259.5" y="245.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">预期输出：阶段性瓶颈、方案判断边界与适用范围</text>
</svg>
