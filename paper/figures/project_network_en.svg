<path d="M47 113 L75 132" fill="none" stroke="#496F91" stroke-width="1.1"/>
<path d="M111 113 L83 132" fill="none" stroke="#496F91" stroke-width="1.1"/>
<text x="81" y="157.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Normal state: full F+X</text>
<text x="81" y="172.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Declared faults: F + X calls</text>
</g>
<g id="e:metered-power">
<path d="M147 120 L165 120" fill="none" stroke="#23364A" stroke-width="1.5"/>
<path d="M187 120 L204 120" fill="none" stroke="#23364A" stroke-width="1.5" marker-end="url(#arrow)"/>
