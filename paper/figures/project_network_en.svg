<text x="270" y="102" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#23364A">Commissioned K</text>
<text x="270" y="117" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#23364A">External tasks w</text>
<path d="M222 130 L350 130" fill="none" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="286" y="146.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Defer q now · recover r later</text>
<text x="286" y="163.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Equipment mapping to power P</text>
<text x="286" y="179.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Idle, execution, recovery, support</text>
</g>
<g id="n:cfe-attribution">
