<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Three progress paths shape staged deliverability</title><desc id="desc">Given business, equipment, and grid paths determine available stage resources. Hourly deferral, recovery, and CFE checks evaluate each stage.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526a7d"/></marker>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#203649}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#40586b}.link{fill:none;stroke:#526a7d;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="710" fill="white"/>
<text x="600" y="44" text-anchor="middle" class="title">Three progress paths shape staged deliverability</text>
<rect x="25" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="200.0" y="118" text-anchor="middle" class="head">Business ramp-up</text>
<text x="200.0" y="157" text-anchor="middle" class="body">Task arrivals over time</text>
<text x="200.0" y="191" text-anchor="middle" class="body">Fast or slow demand growth</text>
<path class="link" d="M200 235 V265 H600 V295"/>
<rect x="425" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="600.0" y="118" text-anchor="middle" class="head">Equipment commissioning</text>
<text x="600.0" y="157" text-anchor="middle" class="body">Modules become available</text>
<text x="600.0" y="191" text-anchor="middle" class="body">Commissioned capacity K</text>
<path class="link" d="M600 235 V265 H600 V295"/>
<rect x="825" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="1000.0" y="118" text-anchor="middle" class="head">Grid construction</text>
<text x="1000.0" y="157" text-anchor="middle" class="body">On-time or delayed completion</text>
<text x="1000.0" y="191" text-anchor="middle" class="body">Built assets provide capacity</text>
<path class="link" d="M1000 235 V265 H600 V295"/>
<rect x="150" y="295" width="900" height="115" rx="12" fill="#edf5ef" stroke="#89a99a" stroke-width="1.7"/>
<text x="600.0" y="333" text-anchor="middle" class="head">Available resources and the given access plan</text>
<text x="600.0" y="372" text-anchor="middle" class="body">Equipment capacity · task occupancy · network state · clean resources</text>
<path class="link" d="M600 410 V440 H200 V470"/>
<path class="link" d="M600 410 V440 H600 V470"/>
<path class="link" d="M600 410 V440 H1000 V470"/>
<rect x="25" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="200.0" y="508" text-anchor="middle" class="head">Reduce demand now</text>
<text x="200.0" y="547" text-anchor="middle" class="body">Eligible tasks and requests</text>
<text x="200.0" y="581" text-anchor="middle" class="body">Shared adjustment q+r≤D</text>
<rect x="425" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="600.0" y="508" text-anchor="middle" class="head">Recover before deadlines</text>
<text x="600.0" y="547" text-anchor="middle" class="body">Equipment and power headroom</text>
<text x="600.0" y="581" text-anchor="middle" class="body">Clean windows and deadlines</text>
<rect x="825" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="1000.0" y="508" text-anchor="middle" class="head">Meet both requirements</text>
<text x="1000.0" y="547" text-anchor="middle" class="body">Network and hourly CFE</text>
<text x="1000.0" y="581" text-anchor="middle" class="body">Task completion and debt</text>
<text x="600" y="672" text-anchor="middle" class="small">Output: stage bottlenecks and delivery status under the stated checks</text>
</svg>
