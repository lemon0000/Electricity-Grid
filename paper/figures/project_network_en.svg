<text x="448" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#23364A">Y</text>
<text x="450" y="143.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Same hour + region</text>
<text x="450" y="159.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Attributable limit</text>
<text x="450" y="175.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Attribute accounting</text>
