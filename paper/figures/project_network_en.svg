<text x="381" y="96" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#23364A">y</text>
</g>
<g id="c:hourly-checks">
<path d="M286 198 L286 215" fill="none" stroke="#23364A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="18" y="220" width="483" height="69" rx="4" fill="#EAF4F1" stroke="#B7D4CC" stroke-width="0.8"/>
<text x="259.5" y="237.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">Joint hourly checks; debt and budgets carry between hours</text>
<path d="M178 247 L178 280" fill="none" stroke="#BAD1CA" stroke-width="0.8"/>
<path d="M340 247 L340 280" fill="none" stroke="#BAD1CA" stroke-width="0.8"/>
<text x="98" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Computing + adjustment</text>
<text x="98" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">0 ≤ w − q + r ≤ K;  q + r ≤ D</text>
<text x="259" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Metered power + grid</text>
<text x="259" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">F/X, balances and declared limits</text>
<text x="420" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">Hourly clean matching</text>
<text x="420" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">αPΔt ≤ y ≤ Y</text>
</g>
</svg>
