<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">智算中心分期投产与电网扩建的决策和运行联系</title>
  <desc id="desc">逐步观察业务及项目进度，据此决定计算模块、电网工程及接入容量；已形成资源接受逐时任务、电网与清洁匹配检查，结果约束建设选择。图表示研究方案。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6c7d"/></marker>
    <style>text{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#21364a}.head{font-size:24px;font-weight:700}.body{font-size:22px}.label{font-size:20px;fill:#526779}.link{fill:none;stroke:#5b6c7d;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="4" y="4" width="1112" height="612" rx="16" fill="#fff" stroke="#d2dbe3" stroke-width="1.5"/>
  <text x="34" y="44" class="head">季度建设决策</text>
  <path class="link" d="M341 153 H386"/><path class="link" d="M723 153 H768"/>
  <rect x="34" y="68" width="307" height="170" rx="10" fill="#f0f5fa" stroke="#8da9c1"/>
  <text x="56" y="104" class="head">观察当期已知信息</text>
  <text x="56" y="144" class="body">客户业务与设备交付</text>
  <text x="56" y="180" class="body">审批环境与在建进度</text>
  <text x="56" y="216" class="body">原有设备、合同和债务</text>
  <rect x="386" y="68" width="337" height="170" rx="10" fill="#edf5ef" stroke="#83a990"/>
  <text x="408" y="104" class="head">决定后续启动与接入</text>
  <text x="408" y="144" class="body">计算模块采购与安装</text>
  <text x="408" y="180" class="body">电网工程开工</text>
  <text x="408" y="216" class="body">保供F与条件容量X</text>
  <rect x="768" y="68" width="316" height="170" rx="10" fill="#f0f5fa" stroke="#8da9c1"/>
  <text x="790" y="104" class="head">按工期形成可用资源</text>
  <text x="790" y="144" class="body">已投运计算能力K</text>
  <text x="790" y="180" class="body">实际建成的电网</text>
  <text x="790" y="216" class="body">当期可兑现的接入权</text>
  <path class="link" d="M926 238 V282 H554 V330"/>
  <text x="407" y="272" class="label">设备与电网状态进入连续运行检查</text>
  <text x="34" y="315" class="head">逐小时业务与供电</text>
  <path class="link" d="M341 415 H386"/><path class="link" d="M723 415 H768"/>
  <rect x="34" y="338" width="307" height="156" rx="10" fill="#fff8e9" stroke="#cbb47b"/>
  <text x="56" y="374" class="head">外部输入逐时到达</text>
  <text x="56" y="414" class="body">同一业务与任务期限</text>
  <text x="56" y="450" class="body">电网状态与清洁额度</text>
  <rect x="386" y="338" width="337" height="156" rx="10" fill="#edf5ef" stroke="#83a990"/>
  <text x="408" y="374" class="head">安排执行、延期与补做</text>
  <text x="408" y="414" class="body">一份任务与恢复债务</text>
  <text x="408" y="450" class="body">设备余量及q+r≤D</text>
  <rect x="768" y="338" width="316" height="156" rx="10" fill="#f0f5fa" stroke="#8da9c1"/>
  <text x="790" y="374" class="head">检查完整履约</text>
  <text x="790" y="414" class="body">网络约束与小时CFE</text>
  <text x="790" y="450" class="body">任务按期完成与成本</text>
  <path class="link" d="M926 494 V542 H20 V253 H554 V244"/>
  <text x="160" y="582" class="label">运行检查约束建设选择；债务只沿连续物理时间或完整过渡模型延续</text>
</svg>
