<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">三种进度决定分阶段接入的履约条件</title><desc id="desc">给定业务、设备与电网路径形成当期资源；逐小时检查延期、恢复与小时CFE，评价各阶段履约。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526a7d"/></marker>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#203649}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#40586b}.link{fill:none;stroke:#526a7d;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="710" fill="white"/>
<text x="600" y="44" text-anchor="middle" class="title">三种进度决定分阶段接入的履约条件</text>
<rect x="25" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="200.0" y="118" text-anchor="middle" class="head">业务需求路径</text>
<text x="200.0" y="157" text-anchor="middle" class="body">任务逐步到达</text>
<text x="200.0" y="191" text-anchor="middle" class="body">业务快慢达产</text>
<path class="link" d="M200 235 V265 H600 V295"/>
<rect x="425" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="600.0" y="118" text-anchor="middle" class="head">设备投运路径</text>
<text x="600.0" y="157" text-anchor="middle" class="body">分批完成安装与调试</text>
<text x="600.0" y="191" text-anchor="middle" class="body">只有投运设备提供K</text>
<path class="link" d="M600 235 V265 H600 V295"/>
<rect x="825" y="80" width="350" height="155" rx="12" fill="#edf3f8" stroke="#9aafc1" stroke-width="1.7"/>
<text x="1000.0" y="118" text-anchor="middle" class="head">电网建设路径</text>
<text x="1000.0" y="157" text-anchor="middle" class="body">按期或延期投运</text>
<text x="1000.0" y="191" text-anchor="middle" class="body">只有建成工程提供能力</text>
<path class="link" d="M1000 235 V265 H600 V295"/>
<rect x="150" y="295" width="900" height="115" rx="12" fill="#edf5ef" stroke="#89a99a" stroke-width="1.7"/>
<text x="600.0" y="333" text-anchor="middle" class="head">当期资源与给定接入额度</text>
<text x="600.0" y="372" text-anchor="middle" class="body">设备能力 · 业务占用 · 网络状态 · 清洁资源</text>
<path class="link" d="M600 410 V440 H200 V470"/>
<path class="link" d="M600 410 V440 H600 V470"/>
<path class="link" d="M600 410 V440 H1000 V470"/>
<rect x="25" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="200.0" y="508" text-anchor="middle" class="head">当前能否减少负荷</text>
<text x="200.0" y="547" text-anchor="middle" class="body">可延期任务与调用要求</text>
<text x="200.0" y="581" text-anchor="middle" class="body">共享调节额度 q+r≤D</text>
<rect x="425" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="600.0" y="508" text-anchor="middle" class="head">之后能否按期补做</text>
<text x="600.0" y="547" text-anchor="middle" class="body">设备与供电余量</text>
<text x="600.0" y="581" text-anchor="middle" class="body">清洁时段与任务期限</text>
<rect x="825" y="470" width="350" height="155" rx="12" fill="#fff7e8" stroke="#bca578" stroke-width="1.7"/>
<text x="1000.0" y="508" text-anchor="middle" class="head">两类要求能否共同满足</text>
<text x="1000.0" y="547" text-anchor="middle" class="body">网络条件与小时CFE</text>
<text x="1000.0" y="581" text-anchor="middle" class="body">任务完成及债务延续</text>
<text x="600" y="672" text-anchor="middle" class="small">输出：给定计划在哪一阶段遇到什么瓶颈，是否完成声明的履约检查</text>
</svg>
