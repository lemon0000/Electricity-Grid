<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="107.896mm" viewBox="0 0 519 306" role="img" aria-labelledby="title desc">
<title id="title">同一接入点的联合评价框架</title>
<desc id="desc">Metered electricity and clean-energy attribution are distinct flows. Computing capacity, grid conditions, and hourly CFE are checked together.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#23364A"/></marker></defs>
<rect x="0" y="0" width="519" height="306" fill="white"/>
<text x="18" y="22" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#23364A">同一智算中心，同时检查计算、网络与小时CFE</text>
<text x="18" y="38.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="start" fill="#23364A">给定建设与接入计划 · 按实际已投运状态逐小时评价</text>
<g id="n:built-network">
<rect x="18" y="61" width="126" height="134" rx="4" fill="#F2F5F7" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="81" y="79" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#23364A">实际建成电网</text>
<circle cx="43" cy="110" r="5" fill="white" stroke="#496F91" stroke-width="1"/>
<circle cx="116" cy="110" r="5" fill="white" stroke="#496F91" stroke-width="1"/>
<circle cx="79" cy="135" r="5" fill="white" stroke="#496F91" stroke-width="1"/>
<path d="M48 110 L111 110" fill="none" stroke="#496F91" stroke-width="1.1"/>
<path d="M47 113 L75 132" fill="none" stroke="#496F91" stroke-width="1.1"/>
<path d="M111 113 L83 132" fill="none" stroke="#496F91" stroke-width="1.1"/>
<text x="81" y="157.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">正常状态：完整 F+X</text>
<text x="81" y="172.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">声明故障：F 与 X 调用</text>
</g>
<g id="e:metered-power">
<path d="M147 120 L165 120" fill="none" stroke="#23364A" stroke-width="1.5"/>
<path d="M187 120 L204 120" fill="none" stroke="#23364A" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="176" cy="120" r="10" fill="white" stroke="#496F91" stroke-width="1"/>
<text x="176" y="123.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">P</text>
<text x="176" y="97.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">实际取电</text>
<text x="176" y="145.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">固定接入点</text>
</g>
<g id="n:data-center">
<rect x="210" y="61" width="152" height="134" rx="4" fill="#EDF3F8" stroke="#AFC5D6" stroke-width="0.8"/>
<text x="286" y="79" font-family="Arial, Microsoft YaHei, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#23364A">AI智算中心</text>
<rect x="223" y="92" width="15" height="26" rx="1.2" fill="#EAF4F1" stroke="#287F80" stroke-width="0.8"/>
<path d="M226 97 L235 97" fill="none" stroke="#287F80" stroke-width="1.3"/>
<path d="M226 103 L235 103" fill="none" stroke="#287F80" stroke-width="1.3"/>
<path d="M226 109 L235 109" fill="none" stroke="#287F80" stroke-width="1.3"/>
<rect x="243" y="92" width="15" height="26" rx="1.2" fill="#EAF4F1" stroke="#287F80" stroke-width="0.8"/>
<path d="M246 97 L255 97" fill="none" stroke="#287F80" stroke-width="1.3"/>
<path d="M246 103 L255 103" fill="none" stroke="#287F80" stroke-width="1.3"/>
<path d="M246 109 L255 109" fill="none" stroke="#287F80" stroke-width="1.3"/>
<text x="270" y="102" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#23364A">已投运设备 K</text>
<text x="270" y="117" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#23364A">外生任务 w</text>
<path d="M222 130 L350 130" fill="none" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="286" y="146.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">当前延期 q · 后续补做 r</text>
<text x="286" y="163.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">设备映射至实际取电 P</text>
<text x="286" y="179.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">待机、执行、补做与配套用电</text>
</g>
<g id="n:cfe-attribution">
<rect x="399" y="61" width="102" height="134" rx="4" fill="white" stroke="#CAD4DC" stroke-width="0.8"/>
<text x="450" y="79.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">小时CFE归属</text>
<rect x="429" y="92" width="38" height="32" rx="2" fill="#EAF4F1" stroke="#287F80" stroke-width="0.8"/>
<text x="448" y="112" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#23364A">Y</text>
<text x="450" y="143.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">同小时 · 适用区域</text>
<text x="450" y="159.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">可分配的电量上限</text>
<text x="450" y="175.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">归属核算</text>
<path d="M396 111 L366 111" fill="none" stroke="#23364A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="381" y="96" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#23364A">y</text>
</g>
<g id="c:hourly-checks">
<path d="M286 198 L286 215" fill="none" stroke="#23364A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="18" y="220" width="483" height="69" rx="4" fill="#EAF4F1" stroke="#B7D4CC" stroke-width="0.8"/>
<text x="259.5" y="237.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#23364A">每小时共同满足，任务债务与预算跨小时延续</text>
<path d="M178 247 L178 280" fill="none" stroke="#BAD1CA" stroke-width="0.8"/>
<path d="M340 247 L340 280" fill="none" stroke="#BAD1CA" stroke-width="0.8"/>
<text x="98" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">计算与共享调节</text>
<text x="98" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">0 ≤ w − q + r ≤ K;  q + r ≤ D</text>
<text x="259" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">实际取电与网络</text>
<text x="259" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">F/X规则、平衡与声明限额</text>
<text x="420" y="258.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">同小时清洁匹配</text>
<text x="420" y="275.0" font-family="Arial, Microsoft YaHei, sans-serif" font-size="7.6" font-weight="400" text-anchor="middle" fill="#23364A">αPΔt ≤ y ≤ Y</text>
</g>
</svg>
