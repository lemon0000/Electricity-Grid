  cross_run_solution_reuse_allowed: false
  cost_normalization_executed: false
  joint_ac_executed: false

solver:
  cold_interface: highs
  warm_interface: appsi_highs
  warmstart_argument: true
  threads: 4
  random_seed: 0
  target_mip_relative_gap: 1.0e-4
  feasibility_tolerance: 1.0e-6
  bound_consistency_tolerance: 1.0e-6
  time_limit_seconds_per_run: 3600.0
  mip_min_logging_interval_seconds: 5.0
  heartbeat_interval_seconds: 30.0

warm_start:
  source: published_parent_zero_full_selected_state_dispatch
  submission_scope: every_solver_column
  missing_values_allowed: false
  zero_fill_missing_values_allowed: false
  expected_proxy_objective: 0.24328147100424327
  expected_operating_cost_usd: 1108454.611081534
  maximum_constraint_violation: 1.0e-6
  maximum_integrality_violation: 1.0e-8
  objective_absolute_tolerance: 1.0e-6
  appsi_set_solution_status_required: HighsStatus.kOk
  native_acceptance_text: MIP start solution is feasible, objective value is
  native_rejection_text: MIP start solution is infeasible
  accepted_start_must_create_finite_incumbent: true
  preaudit_required_before_submission: true

result_contract:
  legacy_solver_results_required: true
  termination_condition_required: true
  oriented_lower_and_upper_bounds_required: true
  model_solution_load_required: true
  final_residual_audit_required: true
  native_log_required: true
  time_to_first_finite_incumbent_required: true

selection:
  eligibility_rule: both_repetitions_pass_method_specific_start_gate_final_gap_and_residual_audit
  ranking_rule:
    - minimum_median_time_to_first_finite_incumbent_seconds
    - minimum_median_solver_wall_seconds
    - minimum_maximum_solver_wall_seconds
    - method_order
  objective_value_used: false
  no_eligible_method_rule: inconclusive_no_warmstart_selected

