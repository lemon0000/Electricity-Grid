schema: rq2_public_pairwise_replay_config_v1

input:
  grid_need_dispatch_ready: false
  power_system_dispatch_package: data/processed/model_inputs/rts_gmlc_public_grid_need_dispatch_v1
  power_system_dispatch_manifest_sha256: null
  power_system_dispatch_schema: rts_gmlc_public_grid_need_dispatch_v1
  power_training_blocks: 541
  power_holdout_blocks: 530
  workload_package: data/processed/model_inputs/alibaba_dimensionless_workload_blocks_v3
  workload_manifest_sha256: 62f2ec5eefd0c651d8b970a16fce4fb6336ccb75ab09e3d2c67386cc26edb524
  workload_schema: alibaba_dimensionless_workload_blocks_v3
  workload_training_blocks: 34
  workload_holdout_blocks: 34
  block_hours: 24

training_selection:
  method: weighted_marginal_stress_quantile_representatives
  power_system_representatives: 8
  workload_representatives: 8
  power_system_score: max_hourly_grid_need_plus_cfe_call_fraction
  workload_score: maximum_requested_GPU_occupancy_fraction
  selection_uses_holdout_outcomes: false

normalization:
  reference_demand: D_DC
  reference_demand_value: 1.0
  absolute_MW_estimand: false
  workload_fraction_role: time_varying_availability_shape_only
  workload_fraction_is_power: false
  cfe_deficit_role: exogenous_hourly_clean_energy_pressure_signal
  green_call_rule: min(cfe_deficit_fraction_available_flexibility_fraction)
  grid_need_rule: physical_minimum_call_not_truncated_by_business_availability

fixed_policy:
  planning_objective: lexicographic_minimum_flexibility_for_full_training_service
  holdout_provision_reoptimization: false
  holdout_recourse_reoptimization: false
  operational_policy: causal_myopic_grid_first_then_CFE_with_current_state_only
  physical_execution_envelope: correct_shared_envelope_for_both_policies
  maximum_flexibility_budget: 1.0
  minimum_event_power: 1.0e-6
  response_time_hours: 1.0
  curtailment_ramp_per_hour: 1.0
  minimum_recovery_hours: 1.0
  service_shortfall_tolerance: 1.0e-6

registered_cells:
  design: one_factor_at_a_time_threshold_diagnostic_not_joint_parameter_robustness
  base:
    flexible_fraction: 0.20
    recovery_efficiency: 0.85
    normalized_recovery_headroom: 0.10
    maximum_event_duration_hours: 4
    maximum_event_count: 2
    normalized_energy_budget: 0.40
    normalized_debt_limit: 0.20
  levels:
    flexible_fraction: [0.05, 0.20, 0.50]
    recovery_efficiency: [0.60, 0.85, 1.00]
    normalized_recovery_headroom: [0.00, 0.10, 0.30]
    maximum_event_duration_hours: [1, 4, 8]
    maximum_event_count: [1, 2, 4]
    normalized_energy_budget: [0.10, 0.40, 1.00]
    normalized_debt_limit: [0.05, 0.20, 0.50]
  primary_coupling_claim_conditioned_on_each_cell: true
  joint_parameter_robustness_claimed: false

solver:
  name: highs
  expected_highspy_version: 1.15.1
  expected_pyomo_version: 6.10.1
  tee: false

execution:
  formal_execution_ready: false
  independent_R4_review_passed: false
  user_formal_run_authorized: false
  require_all_training_plans_resolved: true
  require_all_pairwise_outcomes_resolved: true
  training_infeasible_cell_rule: >
    Report the cell as fixed-policy estimand undefined; do not fabricate
    pairwise outcomes or reinterpret infeasibility as solver uncertainty.
  checkpoint_directory: results/checkpoints/rq2_public_pairwise_replay_v1

output:
  schema: rq2_public_pairwise_replay_v1
  directory: data/processed/model_inputs/rq2_public_pairwise_replay_v1
