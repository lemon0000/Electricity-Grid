  kappa_grid: 50.0
  kappa_green: 40.0
  kappa_drop: 2000.0
  kappa_breach_firm: 0.0
  kappa_breach_conditional: 0.0
  parameter_status: synthetic_mechanism_only_not_contract_evidence

envelope:
