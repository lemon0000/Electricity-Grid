hourly_cfe_target:
  symbol: alpha_hr
  registered_levels: [0.50, 0.70, 0.85, 1.00]
  level_source: inherited_exactly_from_predecessor_phase_map
  source_field_at_alpha_1: cfe_call_fraction
  renewable_share_reconstruction: 1 - cfe_call_fraction
  raw_deficit_expression: max(alpha_hr - renewable_share, 0) / alpha_hr
  service_call_expression: raw_deficit
  service_call_truncated_to_available_flexibility: false
  business_recovery_headroom_expression: >-
    normalized_recovery_headroom * max(1 - workload_occupancy, 0)
  cfe_compatible_recovery_headroom_expression: max(renewable_share / alpha_hr - 1, 0)
  effective_recovery_headroom_expression: >-
    min(business_recovery_headroom, cfe_compatible_recovery_headroom)
  source_renewable_share_cap: 1.0
  alpha_1_role: registered_stress_endpoint
  alpha_1_zero_cfe_surplus_is_input_semantics: true
  network_call_scaled_with_alpha: false
  target_specific_grid_dispatch_required: false
  interpolation_between_registered_levels: false

arms:
  canonical_order:
    - network_only_shared
    - cfe_only_shared
    - joint_correct_shared
    - joint_b6_separate_planning_shared_execution
  definitions:
    network_only_shared:
      grid_call: mandatory_active
      cfe_call: zero
      planning_envelope: shared
      execution_envelope: shared
    cfe_only_shared:
      grid_call: zero
      cfe_call: target_specific_active
      planning_envelope: shared
      execution_envelope: shared
    joint_correct_shared:
      grid_call: mandatory_active
      cfe_call: target_specific_active
      planning_envelope: shared
      execution_envelope: shared
    joint_b6_separate_planning_shared_execution:
      grid_call: mandatory_active
      cfe_call: target_specific_active
      planning_envelope: separate_by_service_with_shared_connected_demand_cap
      execution_envelope: shared
  forbidden_arm_specific_overrides:
    - hourly_cfe_target
    - grid_need
    - workload_availability
    - connected_demand
    - temporal_envelope
    - training_or_holdout_support
    - representative_selection
    - solver

registered_design:
  primary_factorial:
    factors:
      hourly_cfe_target: [0.50, 0.70, 0.85, 1.00]
      flexible_fraction: [0.05, 0.20, 0.50]
      normalized_recovery_headroom: [0.00, 0.10, 0.30]
    cell_count: 36
    interpretation: nine_discrete_requirement_curves_over_four_CFE_targets
  fixed_parameters:
    recovery_efficiency: 0.85
    maximum_event_duration_hours: 4
    maximum_event_count: 2
    normalized_energy_budget: 0.40
    normalized_debt_limit: 0.20
  secondary_oat:
    anchor:
      hourly_cfe_target: 0.85
      flexible_fraction: 0.20
      normalized_recovery_headroom: 0.10
      recovery_efficiency: 0.85
      maximum_event_duration_hours: 4
      maximum_event_count: 2
      normalized_energy_budget: 0.40
      normalized_debt_limit: 0.20
    varied_levels:
      recovery_efficiency: [0.60, 0.85, 1.00]
      maximum_event_duration_hours: [1, 4, 8]
      maximum_event_count: [1, 2, 4]
      normalized_energy_budget: [0.10, 0.40, 1.00]
      normalized_debt_limit: [0.05, 0.20, 0.50]
    added_unique_cell_count: 10
    joint_parameter_robustness_claimed: false
  exact_unique_cell_count: 46
  selective_cell_reporting_allowed: false
  parameter_level_probability_assumed: false

planning_contract:
  objective: lexicographic_minimum_normalized_flexibility_for_full_training_service
  minimum_flexibility_symbol: D_star
  normalization: fraction_of_D_DC
  registered_capacity_domain: [0.0, 1.0]
  representative_selection:
    method: weighted_marginal_stress_quantile_representatives
    power_system_representatives: 8
    workload_representatives: 8
    common_power_and_workload_representative_ids_across_all_cells: true
    selection_reference_target: 1.00
    selection_uses_holdout_outcomes: false
  full_evaluable_training_support_audit: required
  representative_candidate_fails_full_support:
    status: training_support_failure_estimand_undefined
    capacity_increase_or_reselection_allowed: false
  proven_infeasible_at_registered_cap:
    status: proven_infeasible_at_registered_cap_estimand_undefined
    numeric_capacity_imputation: forbidden
  timeout_missing_incumbent_or_incomplete_certificate:
    status: unresolved
    infeasibility_claimed: false

solver_contract:
  name: gurobi
  expected_package_version: 13.0.2
  threads: 4
  mip_relative_gap: 1.0e-6
  feasibility_tolerance: 1.0e-6
  optimality_tolerance: 1.0e-6
  integer_feasibility_tolerance: 1.0e-6
  random_seed: 0
  time_limit_seconds: null
  tee: false
  incumbent_bound_gap_residual_certificate_required: true

registered_capacity_estimands:
  arm_requirements:
    D_N: D_star_network_only
    D_C: D_star_cfe_only
    D_B: D_star_joint_B6
    D_J: D_star_joint_correct
  limiting_single_service:
    symbol: D_single
    expression: max(D_N, D_C)
  joint_interaction_contrast:
    symbol: I_joint
    expression: D_J - max(D_N, D_C)
    positive_direction: joint_delivery_requires_more_than_the_limiting_single_service
    negative_direction: joint_temporal_portfolio_relief
  separate_envelope_interaction:
    symbol: I_sep
    expression: D_B - max(D_N, D_C)
    positive_direction: separate_envelopes_require_more_than_the_limiting_single_service
    negative_direction: separate_envelopes_require_less_than_the_limiting_single_service
  b6_capacity_bias:
    symbol: A_B6
    expression: D_J - D_B
    positive_direction: B6_underprovisions_relative_to_correct_joint_planning
    negative_direction: B6_overprovisions_relative_to_correct_joint_planning
  exact_decomposition:
    expression: I_joint == I_sep + A_B6
    tolerance: 1.0e-6
  cross_arm_ordering_assumed: false
  ordering_rationale: >-
    Duration, event-count, minimum-event-power, rest, energy, and recovery
    constraints can make shared and separate temporal tracks non-nested.
  signed_capacity_classification:
    positive: contrast_greater_than_tolerance
    near_zero: absolute_contrast_less_than_or_equal_to_tolerance
    negative: contrast_less_than_negative_tolerance
  across_target_monotonicity_assumed: false
  inversion_requires_trajectory_and_binding_constraint_witness: true

frontier_outputs:
  primary_curve:
    x: registered_hourly_cfe_target
    y:
      - D_N
      - D_C
      - D_B
      - D_J
    strata:
      - flexible_fraction
      - normalized_recovery_headroom
  target_status:
    - resolved
    - training_support_failure_estimand_undefined
    - proven_infeasible_at_registered_cap_estimand_undefined
    - unresolved
  first_registered_positive_joint_interaction:
    rule: minimum_registered_alpha_with_I_joint_greater_than_tolerance
    interpolation: false
    none_observed_value: no_positive_joint_interaction_on_registered_grid
  first_registered_negative_joint_interaction:
    rule: minimum_registered_alpha_with_I_joint_less_than_negative_tolerance
    interpolation: false
    none_observed_value: no_negative_joint_interaction_on_registered_grid
  highest_registered_deliverable_target:
    registered_budget: 1.0
    rule: maximum_registered_alpha_with_resolved_D_J_less_than_or_equal_to_budget
    interpolation: false
    no_feasible_target_value: none_on_registered_grid

fixed_policy_holdout:
  operational_policy: causal_myopic_grid_first_then_CFE_with_current_state_only
  correct_policy_capacity: D_J
  separate_policy_capacity: D_B
  physical_execution_envelope_for_joint_policies: shared
  registered_service_metrics:
