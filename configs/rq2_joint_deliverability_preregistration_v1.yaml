    - terminal_recovery_debt
  debt_is_service_failure_without_registered_violation_field: false
  current_complete_blocks_are_right_censored: false

attribution_contract:
  type: nonexclusive_bottleneck_vector
  labels:
    network_single_service_binding:
      condition: network_only_proven_infeasible_or_registered_risk_robust_positive
    cfe_single_service_binding:
      condition: cfe_only_proven_infeasible_or_registered_risk_robust_positive
    joint_extra_requirement:
      condition: I_joint_greater_than_tolerance
    joint_portfolio_relief:
      condition: I_joint_less_than_negative_tolerance
    b6_capacity_underprovisioning:
      condition: A_B6_greater_than_tolerance
    b6_capacity_overprovisioning:
      condition: A_B6_less_than_negative_tolerance
    b6_operational_penalty:
      condition: any_B6_minus_correct_service_risk_transport_LB_greater_than_tolerance
    b6_operational_relief:
      condition: any_B6_minus_correct_service_risk_transport_UB_less_than_negative_tolerance
  exclusive_region_frequency_is_population_probability: false
  one_label_suppresses_another: false
  common_insufficiency_rule: report_the_single_service_binding_vector
  joint_only_rule: both_single_services_nonbinding_and_joint_infeasible_or_I_joint_positive
  b6_bias_is_independent_of_joint_interaction: false

holdout_uncertainty:
  role: robustness_layer
  ambiguity_set: complete_discrete_transport_polytope
  primary_support: finite_grid_need_rows_cross_workload_holdout_blocks
  scalar_endpoints_require_primal_dual_and_attaining_witness: true
  multimetric_statement_requires_one_common_pi_witness: true
  exogenous_grid_infeasibility:
    state: E0
    unconditional_mass_reported: true
    excluded_from_conditional_service_metrics: true
  sampling_uncertainty:
    method: independent_marginal_block_bootstrap
    replicates: 200
    seed: 20260825
    confidence_level: 0.95
  population_joint_law_claimed: false

decision_rules:
  comparison_tolerance: 1.0e-6
  capacity_claim_requires_all_four_resolved: true
  holdout_robust_positive: transport_LB_greater_than_tolerance
  holdout_robust_negative: transport_UB_less_than_negative_tolerance
  holdout_robust_nonpositive: transport_UB_less_than_or_equal_to_tolerance
  holdout_partially_identified: transport_LB_less_than_or_equal_to_tolerance_and_UB_greater_than_tolerance
  publish_all_registered_cells: true
  negative_result_retained: true
  result_contingent_parameter_change_allowed: false
  claim_map:
    positive_I_joint:
      allowed: joint_temporal_delivery_requires_additional_flexibility_on_registered_benchmark
      requires: resolved_capacity_certificate_and_decomposition
    negative_I_joint:
      allowed: joint_temporal_portfolio_relief_on_registered_benchmark
      requires: resolved_capacity_certificate_and_decomposition_and_trajectory_witness
    positive_A_B6:
      allowed: separate_temporal_accounting_omits_registered_joint_requirement
      requires: resolved_capacity_certificate_and_decomposition
    negative_A_B6:
      allowed: separate_temporal_accounting_is_conservative_on_registered_benchmark
      requires: resolved_capacity_certificate_and_decomposition_and_trajectory_witness
    positive_holdout_B6_contrast:
      allowed: frozen_separate_accounting_policy_has_higher_conditional_benchmark_service_risk
      requires: sharp_transport_bound_and_common_pi_when_multimetric
    null_I_joint:
      allowed: no_material_joint_interaction_detected_on_registered_grid
    widespread_single_service_binding:
      allowed: registered_service_bundle_is_limited_by_identified_single_service_bottlenecks

