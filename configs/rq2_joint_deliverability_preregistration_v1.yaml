research_question:
  id: RQ2_joint_temporal_deliverability
  primary: >-
    With the network-security call retained as a mandatory service, how does
    the minimum normalized workload flexibility required for joint delivery
    change as the registered hourly-CFE target rises, and where does the
    complete temporal envelope cease to deliver the registered service bundle?
  attribution: >-
    At each registered target, how much of the requirement is explained by
    the limiting single service, the signed joint temporal interaction, and
    the signed capacity bias induced by separate temporal accounting?
  operational_consequence: >-
    When the separately-accounted capacity is frozen and replayed through the
    shared physical envelope, how much additional service failure or shortfall
    occurs relative to correct joint planning?
  evidence_tier: prospective_confirmatory_public_benchmark
  external_replication_claimed: false
  causal_claimed: false
  engineering_certification_claimed: false

