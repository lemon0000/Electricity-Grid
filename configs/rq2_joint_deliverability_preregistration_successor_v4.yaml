research_question:
  id: RQ2_joint_temporal_deliverability
  primary: >-
    With the network-security call retained as a mandatory service, how does
    the minimum normalized workload flexibility required for joint delivery
    change over the registered hourly-CFE targets?
  attribution: >-
    How much of the certified capacity requirement is associated with the
    limiting single service, signed joint temporal interaction, and signed
    capacity bias from separate temporal accounting?
  operational_consequence: >-
    When separately-accounted and correctly-accounted capacities are frozen,
    how do their service outcomes differ under the same shared physical
    execution policy and finite holdout support?

evidence_scope:
  prospective_confirmatory: true
  public_benchmark: true
  external_replication_claimed: false
  causal_claimed: false
  empirical_joint_distribution_claimed: false
