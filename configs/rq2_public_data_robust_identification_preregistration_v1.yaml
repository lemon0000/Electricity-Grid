schema: rq2_public_data_robust_identification_preregistration_v1

preregistration:
  id: rq2_public_data_robust_identification_preregistration_v1
  date: "2026-08-24"
  status: frozen_before_pairwise_outcome_generation
  predecessor_outcomes_observed: true
  predecessor_role: exploratory_negative_evidence
  formal_execution_ready: false
  formal_result: false
  security_certified: false

research_question:
  estimand: >
    Sharp lower and upper bounds on fixed-policy duplicate commitment and
    service loss over every coupling of the registered RTS-GMLC power-system
    and Alibaba workload marginals.
  primary_units:
    capacity: fraction_of_D_DC
    energy: fraction_of_D_DC_hours
  empirical_joint_distribution_claimed: false
  real_contract_failure_probability_claimed: false

theorems:
  instantaneous_capacity:
    assumptions:
      - both service-call trajectories are nonnegative
      - both trajectories use one common time grid
      - only the instantaneous MW resource is considered
    shared_requirement: max_t(grid_call_t + cfe_call_t)
    separate_requirement: max(max_t(grid_call_t), max_t(cfe_call_t))
    exact_gap: shared_requirement - separate_requirement
    lower_bound: 0
    upper_bound: min(max_t(grid_call_t), max_t(cfe_call_t))
  recovery_debt:
    assumptions:
      - recovery availability is zero during active calls
      - recovery has no ramp constraint or intertemporal marginal cost
      - supplied recovery availability is net of business, connection and CFE limits
    claim: greedy_use_of_all_effective_recovery_minimizes_each_prefix_debt
  exclusions:
    - no_general_feasible_set_nesting_claim_for_the_full_event_MIP
    - no_empirical_probability_guarantee
    - no_engineering_security_guarantee

ambiguity_set:
  type: complete_discrete_transport_polytope
  row_marginal: RTS_GMLC_joint_network_and_CFE_blocks
  column_marginal: Alibaba_dimensionless_workload_blocks
  within_block_hour_order_preserved: true
  primary_support: complete_Cartesian_product
  pairwise_policy_execution: fixed_without_holdout_provision_reoptimization
  sharpness_condition: every_pairwise_outcome_is_resolved
  canonical_diagnostics:
    - independent_product
    - comonotone
    - countermonotone
    - minimum_metric_transport
    - maximum_metric_transport

identification_rules:
  identified_R1: all_differences_zero_and_correct_succeeds_for_every_coupling
  identified_R2: >
    b6_weakly_dominated_for_every_coupling_and_at_least_one_registered_risk_
    lower_bound_strictly_positive
  identified_R3: all_differences_zero_and_correct_fails_for_every_coupling
  partially_identified: multiple_regions_remain_compatible
  unresolved: any_required_optimization_or_pairwise_execution_is_unresolved
  probability_tolerance: 1.0e-9
  normalized_outcome_tolerance: 1.0e-6

mandatory_outputs:
  - complete_pairwise_outcome_table
  - lower_and_upper_bound_for_every_registered_metric
  - optimizing_coupling_for_every_bound
  - identified_or_partial_region
  - unresolved_pair_list
  - ambiguity_reduction_value_by_uncertain_dimension
  - source_config_implementation_and_result_hashes

negative_result_rule:
  no_identified_R2: valid_result_do_not_shrink_ambiguity_set_after_observation
  all_partially_identified: valid_result_report_identification_failure
  all_identified_R3: valid_result_report_common_insufficiency
  selective_reporting_allowed: false

