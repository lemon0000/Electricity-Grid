# RQ2 L5 经济随机模型的正式入口配置（formulation.md §12-14）。
#
# 该配置驱动 experiments/run_rq2_l5_economic_stochastic.py，把 §10.1 的共享 MW
# 灵活性预算与 §13 的服务损失 CVaR 接入统一经济目标
#
#     min C^grid + C^op + lambda^risk * CVaR_beta(L)
#
# 并在同一输入、同一场景、同一预算上限下对比“正确的共享预算模型”与“B6 允许重复
# 承诺的错误基线”，随 lambda 扫描给出 H1（B6 相对正确模型的欠配/高估量）与
# H3（尾部服务损失↔扩建成本的单调权衡）两条可证伪证据。
#
# 诚实边界（agent.md §4/§8）：本入口所有系数、预算上限、价格与场景概率均为
# 冻结的“合成机制参数”，不是真实停电概率、合同能力、小时级网络认证或工程/AC
# 结果。parameter_status 逐层携带。security_certified 恒为 false；本入口不改写
# 冻结的 B3/B4/B5 基线与 repair-010 认证链，也不启动多阶段正式长求解。
#
# 下面这份是本机自检用的“微型合成算例”（2 个等概率场景），用于验证入口管道与
# 不变量；执行机跑更大规模的正式算例时，应在保持同一 schema 的前提下打标签运行。

evaluation:
  id: rq2_l5_economic_stochastic_synthetic_v1
  role: shared_budget_and_service_cvar_economic_optimization_mechanism_demonstration
  # 合成机制参数，不冒充工程/合同/AC 认证。
  parameter_status: synthetic_mechanism_only_not_engineering_or_contract_evidence
  security_certified: false
  # 本入口不发布任何“经济最优/VMA/CFE”的正式结论，只给机制与敏感性证据。
  formal_economic_optimum_published: false

model:
  # 共享灵活性预算上限 D^flex 的可配置上界（MW）。
  max_flexibility_budget_mw: 200.0
  # 首阶段 D^flex 的单位配置成本 -> C^grid（合成价格）。
  provisioning_cost_per_mw: 500.0
  # CVaR 置信水平 beta（尾部），需在 [0, 1)。
  beta: 0.5
  # 求解器：与仓库其余单元测试一致，默认 HiGHS（开源、无许可限制）。
  # 正式大规模算例的引擎选择须走 agent.md §10 的容量门与冻结 pilot，不在此处放松。
  solver_name: highs

# lambda^risk 扫描：给出“期望成本↔尾部服务损失”的权衡曲线（H3）。
# 需为非降序、非负、无重复；结果前冻结（agent.md §9 公平性）。
lambda_sweep: [0.0, 0.05, 0.1, 0.5, 1.0]

# §13/§14 每 MWh 服务/业务损失系数（合成，结果前冻结）。
coefficients:
  kappa_access: 1000.0
  kappa_grid: 50.0
  kappa_green: 40.0
  kappa_drop: 2000.0
  # 本增量不激活 firm/conditional breach 通道（u^F = u^X = 0）。
  kappa_breach_firm: 0.0
  kappa_breach_conditional: 0.0
  parameter_status: synthetic_mechanism_only_not_engineering_or_contract_evidence

# 冻结场景树（合成长周期路径）。probability 必须严格为正且求和为 1。
# grid_need_mw 是场景强制的网络削减（硬安全需求，c_grid >= grid_need，永不与
# 成本/CVaR 交换）；green_call_mw 是竞争同一预算的绿电/CFE 移峰调用；
# connected_demand_mw 为可选 D^conn 上限；hours 把 MW 折算成 MWh。
#
# 参数被有意冻结在一个能同时暴露 H1 与 H3 的机制点上（结果前冻结，agent.md §9）：
#   * 绿电调用 60 MW 与网络需求 20/40 MW 同量级，使“同时服务两类需求”真正吃紧；
#   * 正确的共享模型要满配需 grid+green（stress 40+60=100 MW），B6 分离预算只需
#     max(grid, green)=60 MW，故 B6 在同需求下系统性欠配 -> H1 高估量为正；
#   * provisioning_cost=500 与 kappa_access-kappa_green=960、p_stress=0.5 使
#     买断尾部损失的拐点落在 lambda≈0.021：lambda=0 时正确模型只配到满足 mild 的
#     80 MW（stress 尾部留有 access 缺口），lambda>=0.05 时加配到 100 MW 买断尾部
#     -> 尾部 CVaR 单调下降、期望规划成本单调上升 -> H3。
scenarios:
  - name: mild
    probability: 0.5
    grid_need_mw: 20.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0
  - name: stress
    probability: 0.5
    grid_need_mw: 40.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0

# 交叉校验容差：入口报告的 CVaR 必须与 §13 独立 evaluate_service_cvar 在同一
# 实现分布上一致（否则 fail-closed）。
validation:
  cvar_cross_check_tolerance: 1.0e-6
  fail_closed_on_infeasible_run: true

# 随机种子：本增量为确定性 LP 求解，无抽样，故声明为 null 并如实记录。
# 若后续引入场景抽样，必须固定并记录种子（agent.md §10）。
random_seed: null

# 产物路径（相对仓库根解析）。summary 内嵌 provenance 与诚实标签，
# runs/frontier 为可复现原始结果表。
output:
  runs_path: results/tables/rq2_l5_economic_stochastic_v1/runs.csv
  frontier_path: results/tables/rq2_l5_economic_stochastic_v1/frontier.csv
  summary_path: results/tables/rq2_l5_economic_stochastic_v1/summary.json
