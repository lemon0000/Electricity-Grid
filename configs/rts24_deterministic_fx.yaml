fixed_poi:
  bus: 8
  initial_capacity_mw: 50.0
  application_capacity_mw: 250.0
  parameter_status: synthetic_benchmark_not_site_evidence

existing_branch_upgrade:
  name: bus8_dual_corridor_thermal_uprating
  lead_time_quarters: 2
  rate_a_increase_mw: {11: 100.0, 12: 100.0}
  rate_c_increase_mw: {11: 100.0, 12: 100.0}
  poi_capacity_increase_mw: 200.0
  investment_cost: 25000000.0
  parameter_status: synthetic_benchmark_not_site_evidence

fixed_fx_plan:
  firm_capacity_mw: {q1: 50.0, q2: 50.0, q3: 175.0, q4: 175.0}
  conditional_capacity_mw: {q1: 0.0, q2: 0.0, q3: 75.0, q4: 75.0}
  project_start_quarter: q1
  parameter_status: synthetic_fixed_policy_mechanism_test_not_optimized

service_envelope:
  max_conditional_capacity_mw: 75.0
  minimum_operational_block_mw: 50.0
  minimum_validation_hours: 24.0
  response_model: mw_only_sustained_states_no_duration_or_energy_limits
  continuous_window_status: not_validated_no_chronological_network_trajectory
  parameter_status: synthetic_mw_only_envelope_not_contract_evidence

security:
  branch_set: all_non_islanding
  generator_set: all_positive_capacity
  immediate_branch_rating: rate_c
  sustained_rating: rate_a
  excluded_islanding_policy: report_as_failure
  redispatch_fraction_pmax: 0.50
  response_parameter_status: synthetic_sensitivity_not_for_certification

objective:
  unit_basis: synthetic_objective_units_not_calibrated_currency_year
  access_shortfall_cost_per_mwh: 250.0
  primary_objective_tolerance: 1.0e-5
  contingency_call_treatment: minimum_call_feasibility_certificate_not_event_cost
  reported_cost: direct_convex_qp_numerical_solution_with_l1_linear_feasibility_projection

solver:
  name: highs

validation:
  power_tolerance_mw: 1.0e-6
  loading_tolerance_fraction: 1.0e-6
  ac_scope: not_run_missing_expansion_mva_reactive_and_chronological_network_parameters

chronological_sensitivity:
  timeline_source: rts_gmlc_area1_2020_timestamps_only
  timeline_path: data/raw/rts_gmlc/v0.2.3/upstream
  load_values_used_in_envelope: false
  trace_definition: one_full_active_x_call_at_first_hour_of_each_positive_x_quarter
  recovery_headroom_basis: released_capacity_minus_flat_layer_baseline
  time_step_hours: 1.0
  call_duration_hours: 1.0
  maximum_event_duration_hours: 1.0
  minimum_recovery_hours: 1.0
  maximum_events_by_period: {q1: 0, q2: 0, q3: 1, q4: 1}
  maximum_curtailment_energy_mwh_by_period: {q1: 0.0, q2: 0.0, q3: 75.0, q4: 75.0}
  maximum_recovery_debt_mwh: 150.0
  maximum_recovery_power_mw: 125.0
  minimum_event_power_mw: 50.0
  response_time_hours: 0.25
  curtailment_ramp_mw_per_hour: 300.0
  recovery_efficiency: 1.0
  terminal_debt_limit_mwh_by_period: {q1: 0.0, q2: 0.0, q3: 0.0, q4: 0.0}
  parameter_status: synthetic_chronological_witness_not_contract_or_event_evidence
  hourly_output_path: results/tables/rts24_m3_fx_chronology.csv
  summary_output_path: results/tables/rts24_m3_fx_chronology_summary.json

output:
  quarterly_path: results/tables/rts24_m3_fx_quarters.csv
  state_path: results/tables/rts24_m3_fx_states.csv
  generator_path: results/tables/rts24_m3_fx_generators.csv
