research_question:
  id: RQ2_three_region_boundary
  estimand: >
    Which combinations of hourly CFE target, network-stress activation,
    business recovery headroom, flexibility budget and POI place the correct
    shared-envelope and B6 policies in no-conflict, double-commitment-risk or
    common-insufficiency regions?
  evidence_tier: preregistered_local_derived_benchmark
  causal_claimed: false
  empirical_probability_claimed: false
  engineering_certification_claimed: false

regions:
  R1_no_conflict:
    rule: >
      Both policies are training-feasible and fully evaluable, both have zero
      holdout failure and shortfall within tolerance, and their commitment and
      service metrics are equivalent within tolerance.
  R2_double_commitment_risk:
    rule: >
      B6 is training-feasible when the shared model is proven infeasible, or
      both policies are evaluable and B6 is weakly dominated with a strict
      increase in capacity underprovisioning, failure probability or expected
      shortfall.
  R3_common_insufficiency:
    rule: >
      Both training models are proven infeasible, or both policies have
      equivalent committed flexibility and equivalent positive holdout failure
      or shortfall. A strict correct-minus-B6 capacity gap is classified as R2
      even when both policies have equal positive service failure.
  diagnostic_mixed:
    rule: >
      Directionally inconsistent metrics are reported and are not forced into
      one of the three scientific regions.
  unresolved:
    rule: >
      Any unresolved training or holdout solve is reported separately and is
      not interpreted as infeasibility or as a scientific region.
  tolerances:
    probability: 1.0e-9
    expected_shortfall_mwh: 1.0e-6
    committed_flexibility_mw: 1.0e-6

cfe_recovery_accounting:
  green_call_formula: >
    max(alpha_hr * D_DC - renewable_share_t * D_DC, 0) / alpha_hr
  cfe_compatible_recovery_headroom_formula: >
    max(renewable_share_t * D_DC / alpha_hr - D_DC, 0)
  effective_recovery_headroom_formula: >
    min(business_recovery_headroom_mw,
    cfe_compatible_recovery_headroom_mw)
  applies_to_core_and_recovery_tail: true
  purpose: prevent_deferred_load_from_escaping_hourly_cfe_accounting
  procurement_or_delivery_claimed: false

