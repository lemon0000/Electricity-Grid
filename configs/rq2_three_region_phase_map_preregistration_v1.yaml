decision_rules:
  correctness_gate:
    require_all_network_derivations_resolved: true
    require_no_unresolved_cell: true
    scientific_region_is_not_a_correctness_gate: true
  primary_claim: >
    The paper reports the location and movement of all three regions. It does
    not require the double-commitment region to dominate the grid.
  robustness_claim: >
    A boundary is called robust only when its direction is unchanged across
    the three seeds and both network definitions in the registered validation
    subsets.
  negative_result_rule: >
    Absence of R2 cells or dominance of R3 is a valid result and triggers
    narrowing of the claim, not parameter revision.

