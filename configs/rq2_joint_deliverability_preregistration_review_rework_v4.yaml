    evidence:
      - configs/rq2_joint_deliverability_preregistration_successor_v4.yaml:659-668
      - configs/rq2_joint_deliverability_preregistration_successor_v4.yaml:923-977
      - docs/model_spec/rq2_joint_deliverability_estimands_v3.md:344-351
    scientific_effect: >-
      A certified transport lower or upper endpoint is a universal statement
      over every admissible coupling, whereas compatibility of a common-pi
      phase-I branch is an existential statement about at least one coupling.
      The sealed operational labels combine these incompatible quantifiers, so
      a coupling-compatible sign can be reported as a transport-robust
      operational attribution even when the scalar robust endpoint crosses
      zero.
    required_successor_fix: >-
      Freeze one explicit quantifier order for each operational label. For a
      robust label, require at least one registered metric whose certified
      scalar lower bound exceeds 1e-6 for penalty or whose certified scalar
      upper bound is below -1e-6 for relief, and do not use existential
      common-pi compatibility as evidence for that label. Add adversarial
      tests that distinguish robust endpoint certification from existence of
      a favorable coupling.

