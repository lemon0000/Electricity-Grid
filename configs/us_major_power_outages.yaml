processing:
  id: us_major_power_outages_candidate_cohorts_v1
  missing_token: __MISSING__
  candidate_detail_normalization: trim_lower_collapse_whitespace
  candidate_key:
    - POSTAL.CODE
    - OUTAGE.START.DATE
    - OUTAGE.START.TIME
    - OUTAGE.RESTORATION.DATE
    - OUTAGE.RESTORATION.TIME
    - CAUSE.CATEGORY
    - normalized_cause_category_detail
  duration:
    primary_value: reported_duration_min
    sensitivity_value: timestamp_duration_min
    timestamp_timezone: local_naive_source_clock
    require_timestamp_duration_nonnegative: true
    sustained_rule: reported_duration_min > 0
    zero_duration_rule: reported_duration_min == 0
    missing_duration_action: exclude_from_timed_cohorts
  duplicate_aggregation:
    event_unit: candidate_group
    demand_loss_primary: max_nonmissing_mw
    demand_loss_sensitivity: min_nonmissing_mw
    customers_primary: max_nonmissing_count
    customers_sensitivity: min_nonmissing_count
    duplicate_sum_allowed: false
    nerc_aggregation: sorted_set_with_multi_nerc_flag
  cause_groups:
    weather:
      - severe weather
    equipment_operational:
      - equipment failure
      - system operability disruption
      - fuel supply emergency
    security:
      - intentional attack
    demand_management:
      - public appeal
    topology_outcome:
      - islanding
  cohorts:
    primary_duration:
      unit: candidate_group
      rule: complete_temporal_and_nonnegative_timestamp_and_reported_duration_positive
    known_loss_sensitivity:
      unit: candidate_group
      rule: primary_duration_and_any_nonmissing_demand_loss
    positive_loss_sensitivity:
      unit: candidate_group
      rule: primary_duration_and_max_nonmissing_demand_loss_positive
    zero_duration_sensitivity:
      unit: candidate_group
      rule: complete_temporal_and_nonnegative_timestamp_and_reported_duration_nonnegative
    source_rows_sensitivity:
      unit: source_row
      rule: same_flags_without_candidate_deduplication
    detail_complete_sensitivity:
      unit: candidate_group
      rule: primary_duration_and_nonmissing_normalized_cause_detail
    single_nerc_sensitivity:
      unit: candidate_group
      rule: primary_duration_and_single_nerc_region
    reported_vs_timestamp_sensitivity:
      unit: candidate_group
      rule: primary_duration_with_alternate_duration_value_only
  expected_counts:
