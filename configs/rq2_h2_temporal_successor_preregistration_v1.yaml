execution_control:
  experiment_yaml_must_remain_pytest_smoke: true
  run_tag_created_by_this_task: false
  formal_runner_invoked_by_this_task: false
  solver_invoked_by_this_task: false
  required_before_execution:
    - independent_R4_sol_reviewer_PASS
    - explicit_user_authorization_for_formal_execution
    - trigger_commit_points_to_exact_reviewed_preregistration
