findings:
  - id: full_support_fallback_certificate_not_closed
    severity: major
    evidence:
      - src/evaluation/rq2_joint_deliverability.py:1849-1856
    implementation_effect: >-
      Output validation accepts fallback certificates without requiring a
      resolved certificate or proving that the fallback capacity does not
      exceed the representative incumbent. Forged fallback evidence can
      therefore leave a full-support audit marked passed.
    required_successor_fix: >-
      Reconstruct every fallback outcome with finalize_capacity_certificate,
      require resolved status, compare its certified reported point with the
      representative incumbent, and reject any inconsistency with the audit
      status and failure inventory.

  - id: network_alpha_reuse_certificate_identity_not_validated
    severity: major
    evidence:
      - src/evaluation/rq2_joint_deliverability.py:2894-2930
    implementation_effect: >-
      Counting repeated planning-input hashes does not prove that every
      network-only reuse carries the same capacity certificate and support
      audit. Different network-only results can be published under one
      alpha-invariant planning hash.
    required_successor_fix: >-
      Require canonical equality of all solver-backed network-only arm
      evidence grouped by planning_input_sha256, including status, interval,
      reported point, solver certificate, failures, and full-support audit.

  - id: sealed_outer_omits_local_runtime_dependencies
    severity: major
    evidence:
      - src/models/rq2_joint_deliverability.py:26-31
      - configs/rq2_joint_deliverability_implementation_successor_v1.SHA256SUMS.json:4-12
    implementation_effect: >-
      The sealed model imports local residual and solver-adapter modules that
      are not bound by the implementation outer. Their bytes can change solver
      and certificate behavior without changing the reviewed outer hash.
    required_successor_fix: >-
      Include every local runtime dependency used by the versioned
      implementation in the successor inventory and inner manifest, with
      validator-enforced exact paths and hashes.

  - id: success_directory_fsync_failure_reclassified_as_success
    severity: major
    evidence:
      - src/evaluation/rq2_joint_deliverability.py:3163-3181
    implementation_effect: >-
      A parent-directory fsync exception after success rename can be converted
      to committed success by readback even though readback does not prove
      durable rename persistence.
    required_successor_fix: >-
      Track result and success parent-fsync completion explicitly. Any
      exception after a rename but before its parent fsync completes must
      remain commit_indeterminate and must not be reconciled to success by
      readback alone.

  - id: lifecycle_documentation_not_synchronized
    severity: minor
    evidence:
      - docs/model_spec/blocker_register.md:964-992
      - docs/plan/科研项目执行步骤.md:2160-2185
    implementation_effect: >-
      Governance prose still reports PRE_SEAL_AUDIT after the v1 outer was
      sealed and reviewed.
    required_successor_fix: >-
      Record the v1 sealed hashes and official REWORK verdict, then track the
      versioned successor without altering v1 bytes.

