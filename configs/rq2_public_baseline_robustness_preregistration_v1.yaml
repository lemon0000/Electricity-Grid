schema: rq2_public_baseline_robustness_preregistration_v1
version: 1
frozen_on: 2026-08-25
status: design_only_not_executable

purpose:
  estimand: >-
    Distinguish single-service scarcity, joint-service interaction, and
    B6-specific underprovisioning without changing the frozen v6 data,
    parameter cells, training/holdout split, representative selection,
    physical execution envelope, or solver contract.
  post_hoc_retuning_of_observed_phase_map: false
  upgrades_predecessor_evidence: false

