# RQ2 H2 场景来源消融的【正式规模】入口配置（agent.md §4/§8/§9）。
#
# 与自检用的 configs/rq2_h2_scenario_source_ablation.yaml 同一 schema、同一 runner
# （experiments/run_rq2_h2_scenario_source_ablation.py），差别是把生成式训练场景的
# 统计档位提升到 n_train=200、并把 reduced 臂缩减到 target_count=50 个代表点，使
# “固定同一 holdout、只变训练来源（manual / generated / reduced）” 的对照具有正式
# 分辨率。种子由 configs/rq2_formal_batch.yaml 在 [20260822, 20260823, 20260824]
# 上覆写重复 3 次，逐种子报告 “B6 场景外欠交付” 结论是否跨来源、跨抽样稳健。
#
# 受控变量只有训练来源一个旋钮：三臂共享同一 holdout（下方手工冻结树）、同一系数、
# 同一预算上限、同一安全集、同一求解器，因此 H2 符号在各臂间稳定即可归因于机制而非
# 某一次抽样（§9 公平性）。门禁为 “仅正确性”（每臂每可行策略 CVaR 交叉校验），H2
# 稳健性本身逐臂报告、不设门——某来源削弱 gap 也如实披露而非丢弃。
#
# 诚实边界（agent.md §4/§8）不变：所有系数、预算上限、场景概率均为合成机制参数或
# trace 派生量；generated/reduced 臂额外透传生成器/缩减诚实标签（缩减是对生成训练
# 分布的纯概率质量变换，代表点为输入子集，非新数据）。security_certified 恒为 false；
# 本入口不改写冻结基线，也不启动多阶段正式长求解。holdout 从不参与缩减。

evaluation:
  id: rq2_h2_scenario_source_ablation_formal_v1
  role: out_of_sample_ablation_testing_h2_robustness_across_training_scenario_sources_formal
  parameter_status: synthetic_mechanism_only_not_engineering_or_contract_evidence
  security_certified: false
  formal_vma_published: false

model:
  max_flexibility_budget_mw: 200.0
  provisioning_cost_per_mw: 500.0
  lambda_risk: 0.1
  beta: 0.5
  service_shortfall_tolerance_mw: 1.0e-6
  solver_name: highs

coefficients:
  kappa_access: 1000.0
  kappa_grid: 50.0
  kappa_green: 40.0
  kappa_drop: 2000.0
  kappa_breach_firm: 0.0
  kappa_breach_conditional: 0.0
  parameter_status: synthetic_mechanism_only_not_engineering_or_contract_evidence

# 参与比较的臂（顺序即输出顺序）。
arms:
  - manual
  - generated
  - reduced

# 共享的 “未见 holdout 测试集”：所有臂在此执行既定策略、从不在此规划。三类叶被有意
# 冻结在能同时暴露两种场景外失败模式的点上（结果前冻结，agent.md §9）。
holdout_scenarios:
  - name: holdout_mild
    probability: 0.4
    grid_need_mw: 25.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0
  - name: holdout_stress
    probability: 0.4
    grid_need_mw: 50.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0
  - name: holdout_severe
    probability: 0.2
    grid_need_mw: 90.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0

# manual 臂使用的手工冻结训练树（与自检算例同一机制点）。
training_scenarios:
  - name: train_mild
    probability: 0.5
    grid_need_mw: 20.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0
  - name: train_stress
    probability: 0.5
    grid_need_mw: 40.0
    green_call_mw: 60.0
    connected_demand_mw: 1000.0
    hours: 1.0

# generated / reduced 臂使用的数据驱动训练场景生成器（正式统计档位）。split-aware
# 峰值归一化（除数取训练段峰值），故无 holdout 泄漏；抽样在 seed 下可复现。
# 注意：ablation 的 holdout 恒为上方手工树，故 generator.n_holdout 仅为满足 schema，
# 其产出的 holdout 段不被本入口使用。
generator:
  parameter_status: synthetic_mechanism_only_not_engineering_or_contract_evidence
  split_fraction: 0.5
  window_hours: 24
  n_train: 200
  n_holdout: 60
  seed: 20260822
  grid_stress_scale_mw: 40.0
  green_call_scale_mw: 60.0
  connected_demand_mw: 1000.0
  grid_stress_shape:
    path: data/processed/google_power_2019/v1/hourly_shape.csv
    column: measured_power_util_unweighted_mean
  green_workload_shape:
    path: data/processed/alibaba_gpu_2020/v2020/relative_hourly_workload.csv.gz
    column: requested_gpu_equivalents

# reduced 臂：对 generated 训练场景做 fast-forward 缩减到 target_count 个代表点。
reduction:
  target_count: 50
  # 需求向量 (grid_need_mw, green_call_mw) 上的地面度量范数阶（>=1）；2 即欧氏距离。
  ground_norm_order: 2.0

validation:
  cvar_cross_check_tolerance: 1.0e-6
  fail_closed_on_infeasible_training: true

random_seed: null

output:
  arms_path: results/tables/rq2_h2_scenario_source_ablation_formal_v1/arms.csv
  summary_path: results/tables/rq2_h2_scenario_source_ablation_formal_v1/summary.json
