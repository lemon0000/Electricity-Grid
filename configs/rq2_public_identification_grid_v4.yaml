  expected_pairwise_config_sha256: null
  expected_power_system_dispatch_manifest_sha256: null
  expected_power_system_dispatch_provenance_sha256: null
  expected_workload_manifest_sha256: 62f2ec5eefd0c651d8b970a16fce4fb6336ccb75ab09e3d2c67386cc26edb524
  expected_workload_config_sha256: 571b10ff6874ae2c787420b3328e4f256e1d284864851d5099b7ecf9b5d43c2c
  expected_workload_implementation_sha256: 6f2e0c91733cb30846c85b03b3cd89c07f27c042b29ad3b002b76d64f9264d4b
  expected_workload_source_sha256: a53041f484144ea67c9a1777d85e2dde350c2341c94418da8072c0a94b3821d6
  expected_solver_name: gurobi
  expected_parameter_cells: 15
  expected_power_holdout_blocks: 530
  expected_workload_holdout_blocks: 34

ambiguity_set:
  type: complete_discrete_transport_polytope
  support: unrestricted_complete_Cartesian_product
  within_block_hour_order_preserved: true
  empirical_joint_distribution_claimed: false
  canonical_diagnostics:
    - independent_product
    - comonotone_by_registered_stress_score
    - countermonotone_by_registered_stress_score
    - minimum_metric_transport
    - maximum_metric_transport
  exogenous_grid_infeasibility:
    preserve_unconditional_probability_mass: true
    conditional_contract_risk_support: finite_grid_need_rows_only
    include_in_R3_common_insufficiency: false
    finite_grid_need_imputation: forbidden

registered_metrics:
  - delta_failure_probability
  - delta_expected_shortfall
  - flexibility_underprovisioning
  - correct_failure_probability
  - correct_expected_shortfall
  - delta_peak_recovery_debt
  - delta_terminal_recovery_debt
  - correct_peak_recovery_debt
  - correct_terminal_recovery_debt

classification:
  probability_tolerance: 1.0e-9
  outcome_tolerance: 1.0e-6
  fixed_policy_infeasible_or_missing: unresolved_estimand_not_failure
  compatible_region_rule: one_common_transport_coupling_for_all_metrics

sampling_uncertainty:
  enabled: true
  method: independent_marginal_block_bootstrap
  bootstrap_replicates: 200
  seed: 20260825
  confidence_level: 0.95
  population_identification_claimed: false

ambiguity_reduction:
  method: set_identification_width_reduction
  parameter_design: one_factor_at_a_time
  parameter_level_probability_assumed: false
  joint_parameter_robustness_claimed: false

provenance:
  contract_path: configs/rq2_public_pipeline_provenance_contract_v3.yaml
  contract_sha256: 9a890f6cebf6a2b87b6cee97ec9b3a5074bb40892cee917c98fe58644ff178f9

execution:
  formal_execution_ready: false
  independent_R4_review_passed: false
  user_formal_run_authorized: true
  forbidden_hostnames: [GQPD263XH9]
  required_environment_value: EXECUTION_MACHINE_CONFIRMED

output:
  schema: rq2_public_identification_grid_v4
  directory: results/tables/rq2_public_identification_grid_v4_gurobi
