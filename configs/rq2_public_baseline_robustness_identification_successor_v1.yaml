identification_contract:
  ambiguity_set: complete_discrete_transport_polytope
  row_marginal: finite_grid_need_power_blocks_conditioned_after_E0_separation
  column_marginal: workload_blocks
  marginals_identical_across_registered_cells: true
  scalar_endpoint_solver_api: src.scenarios.block_coupling.bound_transport_expectation
  independent_explicit_dual_required: true
  endpoint_attaining_pi_required: true
  objective_recomputation_required: true
  marginal_residual_required: true
  dual_feasibility_required: true
  primal_dual_gap_required: true
  comparison_tolerance: 1.0e-6
  certificate_tolerance: 1.0e-9
  phase_one_positive_tolerance: 1.0e-8
  timeout_or_solver_failure_is_infeasibility: false
  incomplete_certificate_is_sharp: false
  common_pi:
    solver: scipy.optimize.linprog
    method: highs
    always_feasible_shared_slack_phase_one: true
    status_2_alone_proves_incompatibility: false
    feasible_requires_same_pi_marginals_and_all_inequalities: true
    incompatible_requires_positive_primal_dual_certified_phase_one_optimum: true
    ambiguous_or_uncertified_status: unknown
    exact_branch_inventory:
      - single_network_failure
      - single_network_shortfall
      - single_cfe_failure
      - single_cfe_shortfall
      - joint_capacity
      - joint_failure
      - joint_shortfall
      - b6_capacity
      - b6_failure
      - b6_shortfall
      - no_mechanism

registered_estimands:
  capacity:
    D_by_arm: minimum_normalized_flexibility_for_each_of_four_arms
    I_joint: D_joint_correct_minus_max_D_network_only_D_cfe_only
    U_B6: D_joint_correct_minus_D_joint_B6
  service_risk_metrics:
    - failure_probability
    - expected_shortfall
  service_risk_contrasts:
    - joint_correct_minus_network_only
    - joint_correct_minus_cfe_only
    - joint_b6_minus_joint_correct
  exact_category_deciding_metric_count: 14
  descriptive_debt_metrics:
    - peak_recovery_debt
    - terminal_recovery_debt
  debt_category_deciding: false
  right_censored_terminal_debt_is_failure: false
  E0:
    preserves_unconditional_probability_mass: true
    conditional_service_metrics_defined: false
    missing_or_unresolved_blocks_attribution: true
  T1_mw_only_reference:
    raw_grid_call_trajectory_path: null
    raw_cfe_call_trajectory_path: null
    current_package_contains_required_raw_trajectories: false
    derivation_from_pairwise_outcomes_allowed: false
    implementation_bound: false
    status: future_raw_trajectory_input_required

classification_contract:
  comparison_tolerance: 1.0e-6
  robust_positive: LB_greater_than_tolerance
  robust_nonpositive: UB_less_than_or_equal_to_tolerance
  crossing: LB_less_than_or_equal_to_tolerance_and_UB_greater_than_tolerance
  global_failure_status: unresolved
  exact_exclusive_priority:
    - unresolved
    - training_infeasible_estimand_undefined
    - single_service_insufficiency_supported
    - joint_only_interaction_supported
    - b6_specific_underprovisioning_supported
    - partially_identified
    - no_registered_mechanism_supported
  training_infeasible_requires_proof_under_frozen_solver_contract: true
  timeout_missing_certificate_or_local_failure_is_training_infeasible: false
  metricwise_possible_common_pi_certified_incompatible_is_partial: true
  unknown_common_pi_is_unresolved: true
  debt_can_change_category: false

