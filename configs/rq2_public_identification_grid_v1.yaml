schema: rq2_public_identification_grid_v1

input:
  pairwise_replay_ready: false
  pairwise_replay_package: data/processed/model_inputs/rq2_public_pairwise_replay_v1
  pairwise_replay_manifest_sha256: null
  expected_pairwise_schema: rq2_public_pairwise_replay_v1
  expected_parameter_cells: 15
  expected_power_holdout_blocks: 530
  expected_workload_holdout_blocks: 34

ambiguity_set:
  type: complete_discrete_transport_polytope
  support: unrestricted_complete_Cartesian_product
  within_block_hour_order_preserved: true
  empirical_joint_distribution_claimed: false
  canonical_diagnostics:
    - independent_product
    - comonotone_by_registered_stress_score
    - countermonotone_by_registered_stress_score
    - minimum_metric_transport
    - maximum_metric_transport

registered_metrics:
  - delta_failure_probability
  - delta_expected_shortfall
  - flexibility_underprovisioning
  - correct_failure_probability
  - correct_expected_shortfall
  - delta_peak_recovery_debt
  - delta_terminal_recovery_debt
  - correct_peak_recovery_debt
  - correct_terminal_recovery_debt

classification:
  probability_tolerance: 1.0e-9
  outcome_tolerance: 1.0e-6
  fixed_policy_infeasible_or_missing: unresolved_estimand_not_failure

ambiguity_reduction:
  method: set_identification_width_reduction
  parameter_design: one_factor_at_a_time
  parameter_level_probability_assumed: false
  joint_parameter_robustness_claimed: false

execution:
  formal_execution_ready: false
  independent_R4_review_passed: false
  user_formal_run_authorized: false

output:
  schema: rq2_public_identification_grid_v1
  directory: results/tables/rq2_public_identification_grid_v1
