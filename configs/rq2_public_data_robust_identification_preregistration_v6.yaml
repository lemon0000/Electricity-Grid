schema: rq2_public_data_robust_identification_preregistration_v6

preregistration:
  id: rq2_public_data_robust_identification_preregistration_v6
  date: "2026-08-25"
  status: frozen_before_executor_cross_solver_pilot
  predecessor: configs/rq2_public_data_robust_identification_preregistration_v5.yaml
  predecessor_sha256: dc7d47636531e3ca31c761d70cc4f2af0bf13db52c44e204ff7bbbb4861f07b7
  predecessor_outcomes_observed: true
  observed_predecessor_evidence:
    completed_HiGHS_grid_checkpoints: 202
    full_grid_package_published: false
    diagnosed_E0_source_hours: [6598, 8057, 8058, 8059]
    predecessor_formulation_snapshot_available: false
    predecessor_checkpoint_formal_reuse_allowed: false
    predecessor_checkpoint_role: preserved_nonformal_diagnostic_evidence_only
    successor_certificate_schema_repaired_before_pilot: true
  successor_change_scope: >
    Add explicit E0 handling, correct the capacity estimand to normalized
    minimum-flexibility underprovisioning, audit representative policies on
    complete evaluable training support, require one common coupling for
    partial-region compatibility, add fixed-seed marginal block bootstrap,
    and move formal computation to a new Gurobi successor on the execution
    machine.
  formal_execution_ready: false
  formal_result: false
  security_certified: false

research_question:
  estimand: >
    Conditional sharp lower and upper bounds on normalized minimum-flexibility
    underprovisioning, fixed-policy service loss, and recovery debt over every
    coupling of the finite-grid RTS-GMLC holdout marginal and Alibaba workload
    holdout marginal, with unconditional E0 mass reported separately.
  capacity_estimand: normalized_minimum_flexibility_underprovisioning
  formula: correct_minimum_flexibility_minus_B6_minimum_flexibility
  interconnection_capacity_X_claimed: false
  primary_units:
    capacity: fraction_of_D_DC
    energy: fraction_of_D_DC_hours
  empirical_cross_source_joint_distribution_claimed: false
  empirical_outage_probability_claimed: false
  real_contract_failure_probability_claimed: false

data_contract:
  power_system_blocks:
    hours_per_block: 24
    training_blocks: 541
    holdout_blocks: 530
    reliability_components: 211
    maximum_simultaneous_outages: 1
  workload_blocks:
    hours_per_block: 24
    training_blocks: 34
    holdout_blocks: 34
    normalization_fit_split: training_only
    job_split_policy: exclude_jobs_contributing_to_both_sides
  cross_source_rule: preserve_marginals_do_not_invent_joint_distribution

grid_state_contract:
  finite_grid_need:
    definition: corrective_LP_resolved_with_finite_minimum_POI_curtailment
  exogenous_grid_infeasibility:
    code: E0
    definition: >
      The corrective LP is solver-proven infeasible over curtailment in
      [0,D_DC], and the rebuilt D_DC=0 endpoint is also solver-proven
      infeasible.
    finite_grid_need_imputation: forbidden
    preserve_unconditional_block_probability_mass: true
    preserve_Cartesian_state_rows: true
    service_shortfall_and_debt_metrics: null
    include_in_R3_common_insufficiency: false
  unresolved_grid_need:
    includes:
      - timeout
      - missing_incumbent
      - ambiguous_termination
      - solution_audit_failure
    treated_as_infeasibility: false
    formal_publication_allowed: false

policy_freeze:
  training_only: true
  representative_selection: weighted_marginal_stress_quantiles
  power_representatives: 8
  workload_representatives: 8
  representative_support: finite_grid_need_training_blocks
  objective: minimum_flexibility_subject_to_zero_training_service_shortfall
  complete_training_support_audit: required
  coverage_failure_rule: >
    Mark the cell ineligible, retain the failed pair inventory, and do not
    reselect representatives or increase capacity after observing failures.
  correct_and_B6_frozen_before_holdout: true
  holdout_provision_reoptimization: false
  holdout_recourse_reoptimization: false
  operational_policy: causal_myopic_grid_first_then_CFE_with_current_state_only
  physical_holdout_envelope: correct_shared_envelope_for_both_policies

identification:
  ambiguity_set: complete_discrete_transport_polytope
  unconditional_E0_mass_reported: true
  contract_risk_conditioning: finite_grid_need_power_blocks_only
  finite_power_probability_renormalized: true
  pair_rows_per_eligible_cell: 18020
  finite_metric_rows_per_eligible_cell: >
    number_of_finite_power_blocks_times_34_workload_blocks
  sharpness_condition: every_required_finite_pairwise_outcome_resolved
  registered_metrics:
    - delta_failure_probability
    - delta_expected_shortfall
    - flexibility_underprovisioning
    - correct_failure_probability
    - correct_expected_shortfall
    - delta_peak_recovery_debt
    - delta_terminal_recovery_debt
    - correct_peak_recovery_debt
    - correct_terminal_recovery_debt
  identified_region_rule: metric_bounds_hold_for_every_allowed_coupling
  partial_region_compatibility_rule: one_common_transport_coupling_for_all_metrics
  probability_tolerance: 1.0e-9
  normalized_outcome_tolerance: 1.0e-6

sampling_uncertainty:
  enabled: true
  method: independent_marginal_block_bootstrap
  bootstrap_replicates: 200
  seed: 20260825
  confidence_level: 0.95
  endpoint_interval: percentile
  population_identification_claimed: false

solver_successor:
  target_solver: gurobi
  target_version: 13.0.2
  predecessor_solver: highs
  predecessor_version: 1.15.1
  threads: 4
  mip_relative_gap: 1.0e-6
  feasibility_tolerance: 1.0e-6
  optimality_tolerance: 1.0e-6
  integer_feasibility_tolerance: 1.0e-6
  random_seed: 0
  time_limit_seconds: null
  new_checkpoint_directories_required: true
  predecessor_checkpoint_reuse_allowed: false
  actual_model_scale_recorded: true
  incumbent_bound_gap_and_residual_recorded: true

cross_solver_pilot:
  config_path: configs/rq2_public_solver_pilot_v1.yaml
  blocks:
    ordinary: holdout_s20260822_0013
    congested: holdout_s20260822_0091
    generator_E0: holdout_s20260822_0089
    branch_E0: holdout_s20260822_0150
  repetitions_per_solver: 2
  metrics:
    - wall_time
    - termination_and_status
    - incumbent_and_bound
    - absolute_and_relative_gap
    - residual
    - actual_model_scale
    - finite_grid_need
    - E0_classification
  timeout_is_infeasibility_evidence: false
  activation_rule: every_non_runtime_consistency_check_must_pass
  result_observed: false
  gurobi_eligible_for_formal_successor: false

execution_separation:
  development_hostname: GQPD263XH9
  development_machine_formal_execution_allowed: false
  execution_environment_variable: RQ2_EXECUTION_MACHINE
  required_environment_value: EXECUTION_MACHINE_CONFIRMED
  stage_order: [preflight, pilot, grid, pairwise, identification]
  downstream_activation_requires_verified_upstream_package: true

