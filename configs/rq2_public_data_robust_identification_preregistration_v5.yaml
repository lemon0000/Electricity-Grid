schema: rq2_public_data_robust_identification_preregistration_v5

preregistration:
  id: rq2_public_data_robust_identification_preregistration_v5
  date: "2026-08-25"
  status: frozen_before_formal_grid_need_and_pairwise_execution
  predecessor: configs/rq2_public_data_robust_identification_preregistration_v4.yaml
  predecessor_sha256: a9ccf927cbb72184b08e64b37aa7eaee49e86b026f4d8514ebae3e81b3893286
  successor_change_scope: >
    Preserve the v4 scientific and provenance protocol and replace only the
    formal execution chain with v3 runners that require exact checkpoint
    inventory key sets derived from all registered grid blocks and every
    eligible Cartesian pair.
  predecessor_outcomes_observed: false
  predecessor_role: reviewed_software_predecessor_rejected_for_provenance
  formal_execution_ready: false
  formal_result: false
  security_certified: false

research_question:
  estimand: >
    Sharp lower and upper bounds on dimensionless fixed-policy duplicate
    commitment, service loss, and recovery debt over every coupling of the
    registered RTS-GMLC network+CFE and Alibaba workload holdout marginals.
  primary_units:
    capacity: fraction_of_D_DC
    energy: fraction_of_D_DC_hours
  empirical_joint_distribution_claimed: false
  empirical_outage_probability_claimed: false
  real_contract_failure_probability_claimed: false

data_contract:
  power_system_blocks:
    hours_per_block: 24
    training_blocks: 541
    holdout_blocks: 530
    reliability_components: 211
    maximum_simultaneous_outages: 1
    grid_need: >
      Minimum POI curtailment from an hourly corrective DC LP against fixed
      normal 24-hour SCUC commitment and dispatch.
  workload_blocks:
    hours_per_block: 24
    training_blocks: 34
    holdout_blocks: 34
    normalization_fit_split: training_only
    job_split_policy: exclude_jobs_contributing_to_both_sides
    cross_split_jobs_excluded: 908
    requested_GPU_occupancy_is_power: false
  pair_construction:
    available_flexibility: flexible_fraction_times_capped_workload_fraction
    green_call: min_CFE_deficit_fraction_and_available_flexibility
    grid_need: untruncated_physical_minimum_call
    reason: >
      Keep the individual CFE request within the paired business resource
      while preserving network calls above that resource as common
      insufficiency evidence.

policy_freeze:
  training_only: true
  representative_selection: weighted_marginal_stress_quantiles
  power_representatives: 8
  workload_representatives: 8
  objective: minimum_capacity_subject_to_zero_training_CFE_shortfall
  correct_and_B6_frozen_before_holdout: true
  holdout_provision_reoptimization: false
  holdout_recourse_reoptimization: false
  operational_policy: causal_myopic_grid_first_then_CFE_with_current_state_only
  physical_holdout_envelope: correct_shared_envelope_for_both_policies
  training_infeasible_cell: >
    Fixed-policy estimand undefined; preserve the proof status and do not
    fabricate pairwise metrics or classify it as solver uncertainty.

provenance_contract:
  schema: rq2_public_pipeline_provenance_contract_v2
  stages:
    - grid_need_dispatch_v3
    - pairwise_replay_v3
    - identification_grid_v3
  runtime_verification:
    - runner_and_direct_model_module_sha256
    - solver_package_versions
    - stage_config_sha256
    - source_and_input_package_manifest_sha256
    - checkpoint_inventory_sha256
    - checkpoint_inventory_exact_expected_key_set
    - lowercase_hexadecimal_sha256_digest
    - upstream_stage_provenance_sha256
    - downstream_result_package_manifest_sha256
  checkpoint_rule: >
    Every grid and pairwise checkpoint must bind the canonical stage-base
    provenance hash. A checkpoint from another config, implementation,
    solver, source package, or upstream result must be rejected before reuse.
    Grid inventory keys must equal all registered block IDs. Pairwise
    inventory keys must equal every cell policy checkpoint plus every
    eligible row-by-column Cartesian pair checkpoint.
  publication_rule: >
    Every stage package must publish provenance.json. Checkpointed stages must
    also publish an exact per-checkpoint SHA-256 inventory, and downstream
    stages must verify both the package manifest and the upstream provenance.

ambiguity_set:
  type: complete_discrete_transport_polytope
  row_marginal: 530_RTS_GMLC_network_and_CFE_holdout_blocks
  column_marginal: 34_Alibaba_dimensionless_workload_holdout_blocks
  pairs_per_eligible_cell: 18020
  registered_parameter_cells: 15
  maximum_pair_count_if_every_cell_is_eligible: 270300
  support: unrestricted_complete_Cartesian_product
  within_block_hour_order_preserved: true
  sharpness_condition: every_pairwise_outcome_for_the_cell_is_resolved
  canonical_diagnostics:
    - independent_product
    - comonotone_by_registered_stress_score
    - countermonotone_by_registered_stress_score
    - minimum_metric_transport
    - maximum_metric_transport

registered_metrics:
  - delta_failure_probability
  - delta_expected_shortfall
  - flexibility_underprovisioning
  - correct_failure_probability
  - correct_expected_shortfall
  - delta_peak_recovery_debt
  - delta_terminal_recovery_debt
  - correct_peak_recovery_debt
  - correct_terminal_recovery_debt

identification_rules:
  identified_R1: all_differences_zero_and_correct_succeeds_for_every_coupling
  identified_R2: >
    B6 weakly dominated for every coupling and at least one registered
    capacity or service-risk lower bound strictly positive.
  identified_R3: all_differences_zero_and_correct_fails_for_every_coupling
  partially_identified: multiple_regions_remain_compatible
  unresolved: required_fixed_policy_estimand_or_pairwise_optimization_missing
  probability_tolerance: 1.0e-9
  normalized_outcome_tolerance: 1.0e-6

parameter_design:
  type: one_factor_at_a_time_threshold_diagnostic
  cell_count: 15
  joint_parameter_robustness_claimed: false
  parameter_level_probability_assumed: false
  ambiguity_reduction: >
    Report minimum and maximum transport-interval width reduction if one OAT
    parameter level were known; do not average over unsupported level
    probabilities.
  selective_subrange_reporting_allowed: false

mandatory_outputs:
  - policy_table_and_training_resolution_status
  - complete_pairwise_outcome_table_for_every_eligible_cell
  - unresolved_or_ineligible_cell_list
  - lower_and_upper_bound_for_every_registered_metric
  - optimizing_coupling_for_every_bound
  - independent_comonotone_and_countermonotone_diagnostics
  - identified_partial_or_unresolved_classification
  - ambiguity_reduction_value_by_uncertain_dimension
  - source_config_implementation_checkpoint_and_result_hashes

negative_result_rule:
  no_identified_R2: valid_result_do_not_shrink_ambiguity_set_after_observation
  all_partially_identified: valid_result_report_identification_failure
  all_identified_R3: valid_result_report_common_insufficiency
  training_infeasible: preserve_as_undefined_fixed_policy_estimand
  selective_reporting_allowed: false

