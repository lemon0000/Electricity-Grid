reviewer_finding:
  id: presence_path_recovery_gate_erases_broken_alias_evidence
  finding: >-
    Candidate v5 uses Path.exists() in reconciliation and outcome fields. A broken
    Windows junction remains a path appearance under os.path.lexists/lstat but is
    classified as a cleanly absent success commit, so recovery can report honest
    incomplete instead of fail-closed commit_indeterminate.
  required_rule: >-
    Before any resolve, inspect success, terminal, and every ancestor with
    os.path.lexists and lstat, including Windows reparse and mount detection.
    Only a cleanly absent path chain may be honest_incomplete; every alias,
    reparse, broken-link, inaccessible, or nonordinary appearance must be
    commit_indeterminate, while committed_success requires an exact ordinary
    success directory and a completely clean-absent terminal chain.

