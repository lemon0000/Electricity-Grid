reviewer_finding:
  id: postrename_success_commit_dual_state
  finding: >-
    The v4 publisher can atomically commit a published=true success seal and then
    propagate a post-commit exception as failure. The caller therefore receives
    failure while exact committed success exists, and a later failure path could
    create contradictory success and terminal states.
  required_rule: >-
    Reuse repair-010: the success seal is the unique irreversible commit point;
    after any publisher exception, accept only an exact manifest-and-payload-bound
    committed seal, classify an absent seal as honest incomplete, and classify an
    existing but unprovable seal as commit_indeterminate with no terminal state and
    no resume.

